<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="lpGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#89AACC"/>
      <stop offset="100%" stop-color="#4E85BF"/>
    </linearGradient>
  </defs>
  <!-- Dark Round Background -->
  <rect width="64" height="64" rx="32" fill="#07070a"/>
  <!-- Subtle Gradient Border -->
  <circle cx="32" cy="32" r="30" stroke="url(#lpGrad)" stroke-width="2.5" fill="none"/>
  <!-- LP Monogram -->
  <text 
    x="32" 
    y="42" 
    font-family="Georgia, 'Times New Roman', serif" 
    font-size="28" 
    font-style="italic" 
    font-weight="bold" 
    fill="#ffffff" 
    text-anchor="middle" 
    letter-spacing="-1.5"
  >
    LP
  </text>
</svg>